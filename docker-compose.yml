services:
  dispensia:
    build: .
    container_name: dispensia
    restart: unless-stopped
    environment:
      # per le ricette IA: mettila nel file .env accanto a questo compose
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - '8080:3000'   # HTTP
      - '8443:3443'   # HTTPS (serve per la PWA offline sui telefoni)
    volumes:
      - dispensia-data:/data
      - ./certs:/certs:ro

volumes:
  dispensia-data:
